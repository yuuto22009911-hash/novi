name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # .node-version を唯一の情報源にする。
          # Cloudflare Pages も同じファイルを読むため、環境差が生まれない
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint（Biome + 設計制約）
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test（カバレッジゲート込み）
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # 以下は build 後でないと検査できない。publish するまで気づけない類の問題を潰す
      - name: 成果物の設計制約（exports / RSC 安全 / use client / access public / tree-shaking）
        run: pnpm check:dist

      - name: バンドルサイズ
        run: pnpm size

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # .node-version を唯一の情報源にする。
          # Cloudflare Pages も同じファイルを読むため、環境差が生まれない
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Playwright を用意
        run: pnpm --filter @novi-ui/docs exec playwright install chromium --with-deps

      # jsdom では検証できないものをここで担保する:
      # axe（レイアウトと計算済みスタイルを見る）/ カラースキームのカスケード / 見た目の回帰
      - name: ブラウザ検証（axe / テーマ切替 / 視覚回帰）
        run: pnpm --filter @novi-ui/docs test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          # reporter は CI では 'github' で HTML を出さないため .playwright は存在しない。
          # 失敗時に要るのは実際に撮れた画像で、それは test-results に出る
          path: apps/docs/test-results
          retention-days: 7

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # .node-version を唯一の情報源にする。
          # Cloudflare Pages も同じファイルを読むため、環境差が生まれない
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # LCP ≤ 2.5s / CLS ≤ 0.1 / TBT ≤ 200ms / performance 90+ / a11y 100 をゲートにする。
      # INP はフィールド指標でラボでは測れないため、ラボの代理である TBT で縛る。
      #
      # 5回計測し、中央値で判定する。**TBT だけは最良値で見る。**
      # TBT は同一マシン・同一ページでも 24〜565ms とぶれる指標で、
      # 中央値でも共有ランナーでは閾値をまたぐ（実際 207.5ms で落ちた）。
      # 「一番速く走れたときですら遅い」なら、それはノイズではなく退行。
      - name: Lighthouse（LCP / CLS / TBT ゲート）
        run: pnpm --filter @novi-ui/docs perf

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-reports
          path: apps/docs/.lighthouseci
          retention-days: 7
