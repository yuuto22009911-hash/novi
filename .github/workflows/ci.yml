name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint（Biome + ソースの設計制約）
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test（カバレッジ 90% ゲート込み）
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # 以下は build 後でないと検査できない。publish するまで気づけない類の問題を潰す
      - name: 成果物の設計制約（exports 実在 / RSC 安全 / use client 保持 / access public）
        run: pnpm check:dist

      - name: バンドルサイズ
        run: pnpm size
